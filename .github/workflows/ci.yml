name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src commonsgate_agent
      - name: Compile
        run: uv run python -m compileall -q src commonsgate_agent tests
      - name: Audit production dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file dependency-audit.txt
          uvx pip-audit -r dependency-audit.txt --no-deps --disable-pip

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
