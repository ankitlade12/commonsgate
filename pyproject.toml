[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "commonsgate"
version = "0.1.0"
description = "A reference implementation for agent-invariant access to scarce appointments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CommonsGate contributors" }]
dependencies = [
    # ADK's A2A extra currently installs the protocol types but not the HTTP/SSE
    # server transport used by `adk api_server --a2a`.
    "a2a-sdk[http-server]>=0.3.4,<2.0",
    "fastapi>=0.141,<1.0",
    "google-adk[a2a,gcp]>=2.6.2,<3.0",
    "google-cloud-firestore>=2.21,<3.0",
    "google-genai>=2.9,<3.0",
    "httpx>=0.28,<1.0",
    "opentelemetry-api>=1.41,<2.0",
    "opentelemetry-sdk>=1.41,<2.0",
    "opentelemetry-exporter-gcp-trace>=1.15,<2.0",
    "pydantic>=2.12,<3.0",
    "starlette>=1.3.1,<2.0",
    "uvicorn[standard]>=0.40,<1.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "httpx2>=2.0,<3.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0,<2.0",
    "mypy>=1.18,<3.0",
    "ruff>=0.14,<1.0",
]

[project.scripts]
commonsgate = "commonsgate.cli:main"
commonsgate-api = "commonsgate.api:run"
commonsgate-scheduler = "commonsgate.scheduler:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commonsgate", "commonsgate_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Emitted while importing google-adk 2.7.1; the deprecated config class is
    # internal to ADK and is not instantiated by CommonsGate.
    "ignore:BaseAgentConfig is deprecated and will be removed in future versions.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
